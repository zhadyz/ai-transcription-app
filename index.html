            },

    <style>
      /* Custom Beam Animation */
      @property --angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }
      
      .beam-border {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        pointer-events: none;
        overflow: hidden;
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
        -webkit-mask-composite: xor;
        padding: 1px;
      }
      
      .beam-border::before {
        content: "";
        position: absolute;
        inset: -50%;
        background: conic-gradient(from var(--angle), transparent 0deg, transparent 340deg, white 360deg);
        animation: spin-beam 4s linear infinite;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      
      .group:hover .beam-border::before {
        opacity: 1;
      }

      @keyframes spin-beam {
        from { --angle: 0deg; transform: rotate(0deg); }
        to { --angle: 360deg; transform: rotate(360deg); }
      }

      /* Manual implementation of the beam for wider browser support if @property fails or simple CSS is preferred */
      .beam-border-simple {
          position: absolute; inset: 0; border-radius: 9999px; pointer-events: none; overflow: hidden;
      }
      .beam-border-simple::before {
          content: ""; position: absolute; inset: -2px;
          background: conic-gradient(from 0deg, transparent 0 340deg, white 360deg);
          animation: spin 4s linear infinite; opacity: 0; transition: opacity 0.3s ease;
      }
      .group:hover .beam-border-simple::before { opacity: 1; }

      .reveal-word { transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
      
      /* Grid Overlay */
      .grid-line-v { width: 1px; height: 100%; background: rgba(255,255,255,0.03); }
    </style>
