<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 280px;
      height: 100vh;
      pointer-events: none;
    }

    .menu {
      width: 280px;
      background: linear-gradient(135deg, rgba(20, 18, 8, 0.98) 0%, rgba(28, 24, 10, 0.98) 50%, rgba(22, 19, 9, 0.98) 100%);
      border: 1px solid rgba(200, 140, 35, 0.4);
      border-radius: 12px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(200, 140, 35, 0.2), inset 0 1px 0 rgba(200, 140, 40, 0.15);
      overflow: hidden;
      backdrop-filter: blur(20px);
      pointer-events: auto;
    }

    .menu-header {
      padding: 12px 16px;
      background: linear-gradient(135deg, rgba(35, 30, 13, 0.5) 0%, rgba(40, 34, 15, 0.5) 100%);
      border-bottom: 1px solid rgba(200, 140, 35, 0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .glow {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff8c00;
      box-shadow: 0 0 12px rgba(255, 140, 0, 0.8), 0 0 20px rgba(255, 100, 0, 0.6);
    }

    .title {
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #e89a2f;
      text-shadow: 0 0 8px rgba(255, 140, 0, 0.3);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    .menu-items {
      padding: 4px 0;
    }

    .menu-item {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s;
      border-left: 2px solid transparent;
      color: #d4a550;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.03em;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    .menu-item:hover {
      background: linear-gradient(90deg, rgba(200, 140, 35, 0.15) 0%, rgba(200, 140, 35, 0.08) 100%);
      border-left-color: rgba(200, 140, 35, 0.5);
    }

    .menu-item-icon {
      opacity: 0.7;
      font-size: 13px;
    }

    .separator {
      height: 1px;
      margin: 4px 8px;
      background: linear-gradient(90deg, transparent, rgba(200, 140, 35, 0.2), transparent);
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div class="menu">
    <div class="menu-header">
      <div class="glow"></div>
      <span class="title">STYGIAN</span>
    </div>
    <div class="menu-items">
      <div class="menu-item" data-cmd="start_capture">
        <span class="menu-item-icon">▶</span>
        <span>Start Live Captions</span>
      </div>
      <div class="menu-item" data-cmd="stop_capture">
        <span class="menu-item-icon">⏸</span>
        <span>Stop Live Captions</span>
      </div>
      <div class="separator"></div>
      <div class="menu-item" data-cmd="show_main_window">
        <span class="menu-item-icon">🖥</span>
        <span>Show Main Window</span>
      </div>
      <div class="separator"></div>
      <div class="menu-item" data-cmd="quit_app">
        <span class="menu-item-icon">✕</span>
        <span>Quit STYGIAN</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { invoke } from '@tauri-apps/api/core'
    import { getCurrentWindow } from '@tauri-apps/api/window'

    // Add click handlers to menu items
    document.querySelectorAll('.menu-item[data-cmd]').forEach(item => {
      item.addEventListener('click', async () => {
        const cmd = item.getAttribute('data-cmd')
        try {
          await invoke(cmd)
          if (cmd !== 'show_main_window') {
            const window = getCurrentWindow()
            await window.close()
          }
        } catch (e) {
          console.error('Failed to invoke:', e)
        }
      })
    })

    // Close on click outside
    document.addEventListener('click', async (e) => {
      if (e.target.tagName === 'BODY' || e.target.tagName === 'HTML') {
        const window = getCurrentWindow()
        await window.close()
      }
    })

    // Close on blur
    const window = getCurrentWindow()
    window.onFocusChanged(({ payload: focused }) => {
      if (!focused) {
        window.close()
      }
    })
  </script>
</body>
</html>
